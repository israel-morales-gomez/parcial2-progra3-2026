<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <form id="frmLogin" class="card text-bg-dark" style="width: 380px;">
            <div class="card-header text-center">Login</div>
            <div class="card-body">
                <div id="msgLogin" class="alert alert-danger py-2 d-none" role="alert"></div>
                <div class="mb-3">
                    <input required maxlength="35" placeholder="Usuario" name="txtUsuario" id="txtUsuario"
                        class="form-control" type="text" autofocus>
                </div>
                <div class="mb-3">
                    <input required maxlength="35" placeholder="Clave" name="txtClave" id="txtClave"
                        class="form-control" type="password">
                </div>
            </div>
            <div class="card-footer text-center">
                <input type="submit" value="Ingresar" class="btn btn-primary" id="btnIngresar">
            </div>
        </form>
    </div>
    <script>
        frmLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            let response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    modulo: 'login',
                    usuario: txtUsuario.value,
                    clave: txtClave.value
                })
            }), respuesta = await response.json();

            if (respuesta.msg != 'ok') {
                msgLogin.textContent = respuesta.msg;
                msgLogin.classList.remove('d-none');
                txtClave.value = '';
                txtClave.focus();
                return;
            }
            location.href = '/';
        });
    </script>
</body>
</html>
